name: Public package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pypdf Pillow
      - run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python scripts/check_release.py
      - run: python -m compileall -q multistream scripts tests
