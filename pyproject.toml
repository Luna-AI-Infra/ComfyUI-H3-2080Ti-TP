[project]
name = "comfyui-h3-tp"
version = "0.1.0"
description = "Experimental MiniMax H3 tensor parallelism, caching and SM75 kernels for ComfyUI"
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = []
authors = [{ name = "Luna-AI-Infra" }, { name = "Márton Sági" }]

[project.urls]
Repository = "https://github.com/Luna-AI-Infra/ComfyUI-H3-TP"
Issues = "https://github.com/Luna-AI-Infra/ComfyUI-H3-TP/issues"

[tool.comfy]
DisplayName = "H3 TP — Luna AI Infra"
requires-comfyui = ">=0.42.0"

# Install into ComfyUI/custom_nodes; do not pip-install this tree as a standalone app.
# Additional backends/build prerequisites are documented in docs/INSTALL.md.
